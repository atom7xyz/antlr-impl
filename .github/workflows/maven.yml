# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

permissions:
  contents: write
  packages: write
  actions: write

on:
  push:
    branches: [ "master" ]
    tags:
      - '*.*.*'
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test --file pom.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  build:
    needs: test
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')

      - name: Get Maven version and rename JAR
        run: |
          cd target/
          # Get Maven version from pom.xml
          MAVEN_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Maven version: $MAVEN_VERSION"
          
          # Find the jar-with-dependencies file and rename it
          for jar in *-jar-with-dependencies.jar; do
            if [[ -f "$jar" ]]; then
              mv "$jar" "antlr-impl-$MAVEN_VERSION.jar"
              echo "Renamed $jar to antlr-impl-$MAVEN_VERSION.jar"
              break
            fi
          done
          
          # Remove all other JAR files (keep only the renamed dependencies JAR)
          find . -name "*.jar" -not -name "antlr-impl-$MAVEN_VERSION.jar" -delete
        if: startsWith(github.ref, 'refs/tags/')

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-jars
          path: target/antlr-impl-*.jar

  create-release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/maven-jars/*.jar
          name: ${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}